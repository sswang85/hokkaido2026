<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>2026 Hokkaido</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F7E8DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
  :root{
    /* Fjord Glass template — same glass palette as the Iceland app, with an autumn-foliage accent for Hokkaido */
    --bg-1:#EDCDB4; --bg-2:#F7E8DA;
    --glass:rgba(255,255,255,0.55); --glass-strong:rgba(255,255,255,0.74); --glass-hi:rgba(255,255,255,0.4);
    --card:var(--glass); --card-2:rgba(255,255,255,0.36);
    --ink:#33211B; --ink-2:#71574B; --ink-3:#A68B7D;
    --border:rgba(90,40,20,0.07);
    --gold:#C4581F; --gold-bg:rgba(196,88,31,0.13); --gold-line:#DB7A3A;
    --teal:#A3321F; --teal-bg:rgba(163,50,31,0.11);
    --red:#AE4B3D; --red-bg:rgba(174,75,61,0.11);
    --amber:#9C7420; --amber-bg:rgba(156,116,32,0.13);
    --green:#3C7A56; --green-bg:rgba(60,122,86,0.12);
    --aurora:linear-gradient(90deg,#C4502F,#D98A2B,#E3B341);
    --radius:20px; --radius-sm:13px;
    --shadow:0 1px 1px rgba(90,35,15,0.03), 0 10px 26px -14px rgba(120,45,20,0.20);
  }
  *{box-sizing:border-box}
  html{background:#F7E8DA}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg-1),var(--bg-2) 55%,#F3DCC6);background-attachment:fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.disp{font-family:"Space Grotesk",sans-serif}
  .mono{font-family:"Space Mono",monospace}
  #app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
  header.top{padding:0 18px;height:env(safe-area-inset-top, 12px)}
  header.top h1{font-size:20px;font-weight:700;margin:0 0 3px;letter-spacing:-0.01em}
  header.top p{font-size:13px;color:var(--ink-2);margin:0}
  section{padding:0 16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none;width:0;height:0}
  #infoSubTabs{position:fixed;left:0;right:0;bottom:var(--tabbar-h, 72px);z-index:19;max-width:560px;margin:0 auto;padding:10px 16px 12px;background:linear-gradient(0deg, var(--bg-2) 0%, var(--bg-2) 72%, rgba(247,232,218,0) 100%);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}
  #view-info{padding-bottom:64px}
  .chip{flex-shrink:0;padding:8px 15px;border-radius:999px;border:1px solid var(--border);border-top-color:var(--glass-hi);background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:transform .15s ease}
  .chip.active{background:var(--ink);color:var(--bg-2);border-color:var(--ink)}
  .dayHero{display:flex;align-items:stretch;gap:14px;margin:0;padding:10px 16px 8px;min-height:80px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:linear-gradient(180deg, var(--bg-2) 0%, var(--bg-2) 82%, rgba(247,232,218,0) 100%);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}
  .dayHero::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top, 0px);background:var(--bg-2);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}
  .dayHeroLabelWrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .dayHeroLabelCol{display:flex;flex-direction:column}
  .dayHeroDate{font-family:"Space Mono",monospace;font-size:12px;color:var(--ink-3);margin-top:1px}
  .dayHeroRoute{font-size:14px;font-weight:600;color:var(--ink)}
  .dayHeroDrive{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .dayHeroLabel{font-family:"Space Grotesk",sans-serif;font-size:44px;font-weight:700;line-height:1;display:flex;align-items:center;letter-spacing:-0.01em}
  .dayHeroArrows{display:flex;flex-direction:column;gap:2px;align-self:center}
  .dayArrowBtn{background:none;border:none;color:var(--ink-3);font-size:9px;padding:2px 4px;cursor:pointer;line-height:1}
  .dayArrowBtn:active{color:var(--ink)}
  .dayArrowBtn:disabled{opacity:0.25;cursor:default}
  .dayHeroWeather{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;border-left:1px solid var(--border);padding-left:14px}
  .heroWxRow{display:flex;align-items:baseline;gap:8px}
  .heroWxIcon{font-size:28px;line-height:1}
  .heroWxTemp{font-family:"Space Mono",monospace;font-size:25px;font-weight:700}
  .heroWxCond{font-size:15px;color:var(--ink-2)}
  .heroWxSun{font-size:14px;color:var(--ink-3)}
  .heroWxGrid{display:flex;justify-content:space-between;gap:10px;padding-right:6px}
  .heroWxStat{text-align:left;font-size:14px;color:var(--ink-2);font-weight:600}
  .heroWxMsg{font-size:12px;color:var(--ink-3)}
  #itemList{user-select:none;-webkit-user-select:none}
  #itemList img{-webkit-user-drag:none;user-drag:none}
  .item{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 15px;margin:0 0 10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .item.item-transit{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent;box-shadow:none;padding:8px 15px}
  .item.item-transit .ttl{font-size:15px;font-weight:600;color:#000}
  .item.item-transit .itemIcon{font-size:17px;opacity:0.7}
  .item.item-transit .itemChevron{opacity:0.4}
  .item.item-transit .time{font-size:14px;font-weight:700;color:#000}
  .item.item-photo{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent;box-shadow:none;padding:8px 15px}
  .item.item-photo .ttl{font-size:15px;font-weight:600;font-style:italic;color:var(--gold)}
  .item.item-photo .itemChevron{opacity:0.4}
  .item.item-photo .time{font-size:14px;font-weight:700;color:var(--gold);opacity:0.85}
  .item:active{transform:scale(0.99)}
  .item .itemIcon{font-size:17px;line-height:22px;flex-shrink:0}
  .item .time{font-family:"Space Mono",monospace;font-size:14px;font-weight:700;line-height:22px;width:46px;flex-shrink:0}
  .item .body{flex:1;min-width:0}
  .item .ttl{font-size:15px;line-height:22px;font-weight:600}
  .item .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .blurb{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
  .note{font-size:12.5px;color:var(--ink-2);margin-top:6px;font-style:italic}
  .thumb{max-width:120px;max-height:120px;border-radius:var(--radius-sm);margin-top:8px;display:block;border:1px solid var(--border)}
  .mapLinks{display:flex;gap:16px;margin-top:6px}
  .mapLinksMissing{font-size:12px;color:var(--ink-3);font-style:italic}
  .mapLinks a{font-size:12px;color:var(--teal);text-decoration:none;font-weight:600}
  .locPhoto{border-radius:var(--radius);overflow:hidden;margin-bottom:12px;border:1px solid var(--border)}
  .locPhoto img{width:100%;height:260px;object-fit:cover;display:block}
  .locPhotoCredit{display:block;font-size:10.5px;color:var(--ink-3);text-align:right;padding:5px 4px 0;text-decoration:none;background:var(--card-2)}
  .itemChevron{color:var(--ink-3);font-size:20px;font-weight:400;align-self:center;flex-shrink:0;padding-left:2px}
  .addrow{display:flex;justify-content:center;margin:6px 0 18px}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;border:1px solid var(--border);border-top-color:var(--glass-hi);background:var(--glass-strong);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--bg-2);border-color:var(--ink)}
  .btn.ghost{background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--teal);text-decoration:underline;font-size:13px}
  .btn.danger{color:var(--red);border-color:var(--red-bg);margin-right:auto}
  form.itemForm{background:var(--glass-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;margin:0 0 18px;display:flex;flex-direction:column;gap:11px}
  form.itemForm label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:3px}
  form.itemForm input,form.itemForm select,form.itemForm textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(255,255,255,0.5);color:var(--ink)}
  .formRow{display:flex;gap:10px}
  .formRow>div{flex:1}
  .formActions{display:flex;gap:8px;justify-content:flex-end}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
  .photoPreview{margin-top:8px;position:relative;display:inline-block}
  .photoPreview img{max-width:150px;max-height:150px;border-radius:var(--radius-sm);display:block;border:1px solid var(--border)}
  .photoPreview .rmBtn{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border:none;border-radius:999px;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer}
  .resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .stat{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:12px 14px}
  .stat .lbl{font-size:12px;color:var(--ink-2)}
  .stat .val{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;margin-top:2px}
  .stat.gold .val{color:var(--gold)}
  .stat.teal .val{color:var(--teal)}
  .weatherHead{display:flex;align-items:center;gap:14px;background:var(--glass-strong);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--border);border-top-color:var(--glass-hi);box-shadow:var(--shadow);border-radius:var(--radius);padding:19px;margin-top:14px}
  .weatherHead .icon{font-size:44px;line-height:1;flex-shrink:0}
  .weatherHead .whMain{flex:1;min-width:0}
  .weatherHead .cond{font-size:17px;font-weight:700}
  .weatherHead .whSub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  .weatherHead .whTemp{font-family:"Space Mono",monospace;font-size:34px;font-weight:700;flex-shrink:0}
  .dateLabel{font-size:13px;font-weight:600;color:var(--ink-2);margin:20px 0 2px}
  .sunRow{display:flex;gap:22px;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-size:14px}
  .auroraBox{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:14px;margin-top:12px}
  .auroraBox .lbl{font-size:12px;color:var(--ink-2)}
  .auroraBox .val{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;margin-top:2px}
  .auroraBox .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
  .auroraBox a{color:var(--teal);font-size:12px}
  .vedurBox{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:14px;margin-top:12px}
  .vedurBox .lbl{font-size:12px;color:var(--ink-2)}
  .vedurBox .val{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;margin-top:4px}
  .vedurBox .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
  .vedurBox a{color:var(--teal);font-size:12px}
  .weatherGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .weatherGrid .stat .val{font-size:17px}
  .windArrow{font-size:18px;font-weight:900}
  .weatherMsg{padding:22px 8px;text-align:center;color:var(--ink-2);font-size:13.5px;line-height:1.6}
  .weatherMsg .sub{font-size:12px;color:var(--ink-3);margin-top:4px}
  #tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;max-width:560px;margin:0 auto;padding:7px 10px calc(7px + env(safe-area-inset-bottom, 0px));border-radius:24px 24px 0 0;background:rgba(240,213,192,0.94);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-bottom:none;border-top-color:var(--glass-hi);box-shadow:0 -2px 24px -8px rgba(120,45,20,0.25);isolation:isolate;overflow:hidden}
  .splitPeople{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}
  .splitTotal{font-size:14px;color:var(--ink-2);margin-bottom:10px}
  .splitTotal .mono{font-family:"Space Mono",monospace;font-weight:700;font-size:17px;color:var(--ink)}
  .balanceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .balanceCard{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:12px 14px}
  .balanceName{font-size:12.5px;color:var(--ink-2)}
  .balanceVal{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;margin-top:2px}
  .balanceVal.pos{color:var(--green)}
  .balanceVal.neg{color:var(--red)}
  .settleBox{margin:14px 0 0;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:14px}
  .settleTitle{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
  .settleLine{font-size:14px;padding:4px 0}
  .settleLine .mono{font-family:"Space Mono",monospace;font-weight:700}
  .expenseItem{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px}
  .expenseMain{flex:1;min-width:0}
  .expenseDesc{font-size:14.5px;font-weight:600}
  .expenseMeta{font-size:12px;color:var(--ink-2);margin-top:2px}
  .expenseAmt{font-size:16px;font-weight:700}
  .splitCheckRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .appCard{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:14px;margin:0 0 10px}
  .appName{font-size:15px;font-weight:700}
  .appDesc{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
  .appCatLabel{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
  .appCatLabel:first-child{margin-top:4px}
  .marketTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border);border-top-color:var(--glass-hi);background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
  .marketTable{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
  .marketTable th{text-align:left;padding:10px 12px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--border);white-space:nowrap}
  .marketTable td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:top;line-height:1.5}
  .marketTable td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
  .marketTable tr:last-child td{border-bottom:none}
  .marketBuyGroup{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:13px 14px;margin:0 0 10px}
  .marketBuyCat{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .marketBuyStore{font-size:11px;font-weight:500;color:var(--teal);background:var(--teal-bg);padding:2px 8px;border-radius:999px}
  .marketBuyItems{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
  .recipeCard{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);border-top-color:var(--glass-hi);border-radius:var(--radius);padding:14px;margin:0 0 10px}
  .recipeName{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .recipeTime{font-size:11px;font-weight:500;color:var(--ink-3)}
  .recipeSection{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
  .recipeSection b{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .recipeSection ol{margin:2px 0 0;padding-left:18px}
  .recipeSection li{margin-bottom:2px}
  #tabbar::before{content:'';display:none}
  .tabbtn{flex:1;background:none;border:none;font-family:inherit;font-size:12.5px;color:rgba(51,33,27,0.62);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:17px;cursor:pointer;transition:background .15s ease,color .15s ease}
  .tabbtn .ic{font-size:19px}
  .tabbtn.active{color:var(--ink);background:rgba(255,255,255,0.5)}
  [hidden]{display:none!important}
  #view-info .appName,#view-info .marketBuyCat{font-size:16px!important;color:#A2421A!important}
  #itemList .item .ttl,#itemList .item .time,#dayHeroLabel{color:#A2421A!important;opacity:1!important}
  #splashScreen{position:fixed;inset:0;z-index:9999;background:#0B0F11;overflow:hidden;transition:opacity .6s ease}
  #splashScreen.fade-out{opacity:0;pointer-events:none}
  #splashScreen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #splashScreen .splashGradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,16,0) 38%,rgba(10,14,16,0.88) 100%)}
  #splashScreen .splashContent{position:absolute;left:0;right:0;bottom:0;padding:0 24px 52px;color:#fff;text-align:center}
  #splashScreen .splashTitle{font-family:"Space Grotesk",sans-serif;font-size:27px;font-weight:700;letter-spacing:0.03em;text-shadow:0 2px 14px rgba(0,0,0,0.4)}
  #splashScreen .splashSub{font-size:12px;color:rgba(255,255,255,0.72);margin-top:6px;letter-spacing:0.08em}
  #splashScreen .splashDots{display:flex;gap:6px;justify-content:center;margin-top:24px}
  #splashScreen .splashDots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.85);animation:splashPulse 1.2s ease-in-out infinite}
  #splashScreen .splashDots span:nth-child(2){animation-delay:.15s}
  #splashScreen .splashDots span:nth-child(3){animation-delay:.3s}
  @keyframes splashPulse{0%,80%,100%{opacity:.25;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="splashScreen">

function timeToMin(t){ if(!t) return null; const p=t.replace(':',''); return parseInt(p.slice(0,2))*60+parseInt(p.slice(2,4)); }
function minToTime(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function fmtDuration(min){
  if(min==null||isNaN(min)) return '';
  const h=Math.floor(min/60), m=min%60;
  if(h===0) return `${m}m`;
  if(m===0) return `${h}h`;
  return `${h}h${m}m`;
}
function findCoords(str){
  if(!str) return null;
  let best=null, bestEnd=-1, bestLen=0;
  for(const p of PLACES){
    if(p.key==='custom') continue;
    for(const k of p.keys){
      const idx=str.lastIndexOf(k);
      if(idx<0) continue;
      const end=idx+k.length;
      if(end>bestEnd || (end===bestEnd && k.length>bestLen)){ bestEnd=end; bestLen=k.length; best=p; }
    }
  }
  return best;
}
function mapLinksHtml(name){
  if(!name) return '';
  const c=findCoords(name);
  if(!c){
    return `<div class="mapLinks mapLinksMissing">📍 找不到對應地圖座標，請自行在地圖 App 搜尋「${name}」</div>`;
  }
  const q=encodeURIComponent(c.q||name);
  const appleUrl = `https://maps.apple.com/?ll=${c.lat},${c.lng}&q=${q}`;
  const googleUrl = c.q ? `https://www.google.com/maps/search/?api=1&query=${q}` : `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
  return `<div class="mapLinks"><a href="${appleUrl}" target="_blank" rel="noopener">🍎 Apple Maps</a><a href="${googleUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a></div>`;
}
async function fetchLocationImage(query){
  const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
  const res=await fetchWithTimeout(url,6000);
  const data=await res.json();
  const pages=data && data.query && data.query.pages;
  if(!pages) throw new Error('無圖片');
  const page=Object.values(pages)[0];
  const info=page && page.imageinfo && page.imageinfo[0];
  if(!info) throw new Error('無圖片');
  return {thumb:info.thumburl||info.url, page:info.descriptionurl};
}
function compressImageFile(file, maxDim=560, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=()=>reject(new Error('image load failed'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function fmtT(d){ if(!d||isNaN(d)) return '--:--'; return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tokyo'}); }

const SEED_VERSION = '2026-10-09b';
function loadState(){
  let state=null;
  try{
    const raw = localStorage.getItem('hokkaido-trip-data');
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state) {
    try{ localStorage.setItem('hokkaido-seed-version', SEED_VERSION); }catch(e){}
    return JSON.parse(JSON.stringify(SEED));
  }
  // 若 SEED 版本更新，直接以新版行程覆蓋（使用者自行新增的天數會保留）
  let savedVer=null;
  try{ savedVer = localStorage.getItem('hokkaido-seed-version'); }catch(e){}
  if(savedVer !== SEED_VERSION){
    const seedIds=new Set(SEED.days.map(d=>d.id));
    const userAdded=state.days.filter(d=>!seedIds.has(d.id));
    const fresh=JSON.parse(JSON.stringify(SEED));
    fresh.days=[...fresh.days,...userAdded].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    try{ localStorage.setItem('hokkaido-seed-version', SEED_VERSION); }catch(e){}
    window.__seedJustUpgraded=true;
    return fresh;
  }
  const existingIds=new Set(state.days.map(d=>d.id));
  const missing=SEED.days.filter(sd=>!existingIds.has(sd.id)).map(sd=>JSON.parse(JSON.stringify(sd)));
  if(missing.length){
    state.days=[...state.days,...missing].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  }
  return state;
}
function saveState(){
  const json=JSON.stringify(STATE);
  const sizeKB=Math.round(json.length/1024);
  try{
    localStorage.setItem('hokkaido-trip-data', json);
  } catch(e){
    console.error('save failed',e);
    alert(`儲存失敗（目前整份行程資料約 ${sizeKB} KB）。瀏覽器本機儲存空間可能已滿或被封鎖（例如無痕模式），建議刪除幾張舊照片後再試一次。`);
  }
}

function addDay(){
  const label=prompt('這天怎麼標示？例如 D11'); if(!label) return;
  const date=prompt('日期？格式 YYYY-MM-DD','2026-10-18'); if(!date) return;
  const id='d'+Date.now();
  STATE.days.push({id,label,date,sub:'',items:[]});
  currentDayId=id; saveState(); saveDaysSync(); renderAll();
}
function goToDay(delta){
  const idx=STATE.days.findIndex(d=>d.id===currentDayId);
  const newIdx=idx+delta;
  if(newIdx<0 || newIdx>=STATE.days.length) return;
  currentDayId=STATE.days[newIdx].id;
  renderAll();
}

  }, {passive:true});
  zone.addEventListener('touchend', e=>{
    if(!isItineraryActive()) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      swiped=true;
      goToDay(dx>0?-1:1);
    }
  }, {passive:true});
  zone.addEventListener('mousedown', e=>{
    if(!isItineraryActive()) return;
    if(e.target.closest('input, textarea, select, button, a, label')) return;
    sx=e.clientX; sy=e.clientY; swiped=false; dragging=true;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(dragging) e.preventDefault();
  });
  window.addEventListener('mouseup', e=>{
    if(!dragging) return;
    dragging=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      swiped=true;
      goToDay(dx>0?-1:1);
    }
  });
  zone.addEventListener('click', e=>{
    if(swiped){ e.stopPropagation(); e.preventDefault(); swiped=false; }
  }, true);
})();

let gpsCoords=null;
function getGpsCoords(){
  return new Promise(resolve=>{
    if(gpsCoords){ resolve(gpsCoords); return; }
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ gpsCoords={lat:pos.coords.latitude, lng:pos.coords.longitude}; resolve(gpsCoords); },
      ()=>resolve(null),
      {timeout:8000, maximumAge:600000}
    );
  });
}

let heroWxReqId=0;
async function renderDayHeroWeather(day){
  const box=document.getElementById('dayHeroWeather');
  const myReq=++heroWxReqId;

  const transitItems = day.items.filter(it=>it.type==='transit' && it.icon!=='✈️' && it.icon!=='🚐' && it.icon!=='⛴️' && it.icon!=='🚶' && it.icon!=='🚆' && it.icon!=='🚇' && it.icon!=='🚃');
  const transitMin = transitItems.reduce((s,it)=>s+(it.durationMin||0),0);
  const driveLabel = transitMin>0 ? `開車約 ${fmtDuration(transitMin)}` : '';
  const routeHtml = day.sub ? `<div class="dayHeroRoute">${day.sub}</div>${driveLabel?`<div class="dayHeroDrive">${driveLabel}</div>`:''}` : '';

  box.innerHTML=routeHtml+'<div class="heroWxMsg">讀取目前位置中…</div>';

  const coords=await getGpsCoords();
  if(myReq!==heroWxReqId) return;
  if(!coords){
    box.innerHTML=routeHtml+'<div class="heroWxMsg">📍 無法取得目前位置，請允許瀏覽器的定位權限後重新整理頁面</div>';
    return;

  box.innerHTML=routeHtml+'<div class="heroWxMsg">讀取天氣中…</div>';
  const todayStr=new Date().toISOString().slice(0,10);
  let sunLine='';
  if(typeof SunCalc!=='undefined'){
    const t=SunCalc.getTimes(new Date(), coords.lat, coords.lng);
    const fmtLocal=d=>{ if(!d||isNaN(d)) return '--:--'; return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}); };
    sunLine=`<div class="heroWxSun">日出 ${fmtLocal(t.sunrise)}　日落 ${fmtLocal(t.sunset)}</div>`;
  }

  const [curRes, dailyRes] = await Promise.allSettled([
    fetchCurrentConditions(coords.lat, coords.lng),
    fetchDailyForecast(coords.lat, coords.lng, todayStr)
  ]);
  if(myReq!==heroWxReqId) return;

  let topLine;
  if(dailyRes.status==='fulfilled'){
    const {tmax,tmin,windSpeed,windGust,windDir}=dailyRes.value;
    const code = curRes.status==='fulfilled' ? curRes.value.code : null;
    const isDay = curRes.status==='fulfilled' ? curRes.value.isDay : 1;
    const wc = weatherIconFor(code, isDay);
    const curTemp = curRes.status==='fulfilled' ? curRes.value.temp : null;
    topLine=`<div class="heroWxRow"><span class="heroWxIcon">${wc.icon}</span><span class="heroWxTemp">${curTemp==null?'--':Math.round(curTemp)}°</span><span class="heroWxCond">${wc.label}</span></div>`;
    const {pprob,uv}=dailyRes.value;
    topLine += `<div class="heroWxGrid">
      <div class="heroWxStat">降雨：${pprob==null?'--':pprob+'%'}</div>
      <div class="heroWxStat">UV：${uv==null?'--':uv.toFixed(1)}</div>
      <div class="heroWxStat">風速：${windSpeed==null?'--':Math.round(windSpeed)}/${windGust==null?'--':Math.round(windGust)} ${windDirLabel(windDir)||''}</div>
    </div>`;
  } else {
    topLine='<div class="heroWxMsg">尚無今天的天氣預報（超出 16 天預報範圍）</div>';
  }
  box.innerHTML = routeHtml + topLine + sunLine;
}

let weatherReqId=0;

// 帶逾時保護的 fetch：避免任何一個網路請求卡住不動時，整個天氣讀取被無限期卡死
async function fetchWithTimeout(url, timeoutMs=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, {signal:controller.signal});
  } finally {
    clearTimeout(timer);
  }
}

async function fetchCurrentConditions(lat,lng){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code,is_day&timezone=auto&wind_speed_unit=ms`;
  const res=await fetchWithTimeout(url);
  const data=await res.json();
  if(data.error||!data.current) throw new Error(data.reason||'無法取得即時天氣');
  return {temp:data.current.temperature_2m, code:data.current.weather_code, isDay:data.current.is_day};
}

async function fetchDailyForecast(lat,lng,dateStr){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant&timezone=auto&wind_speed_unit=ms&start_date=${dateStr}&end_date=${dateStr}`;
  const res=await fetchWithTimeout(url);
  const data=await res.json();
  if(data.error) throw new Error(data.reason||'查詢失敗');
  const d=data.daily;
  if(!d||!d.time||!d.time.length) throw new Error('沒有這天的資料');
  return {
    tmax:d.temperature_2m_max[0], tmin:d.temperature_2m_min[0], pprob:d.precipitation_probability_max[0], uv:d.uv_index_max[0],
    windSpeed:d.wind_speed_10m_max?.[0], windGust:d.wind_gusts_10m_max?.[0], windDir:d.wind_direction_10m_dominant?.[0]
  };
}

let daysSyncing=false;
function saveDaysSync(){
  if(window.firebaseSync && window.firebaseSync.ready && !daysSyncing){
    const cleanDays = STATE.days.map(d=>({
      ...d,
      items: d.items.map(it=>{ const {photoData, ...rest} = it; return rest; })
    }));
    window.firebaseSync.save({days:cleanDays, updatedAt:Date.now()});
  }
}
function initDaysSync(){
  function setupListener(){
    if(!window.firebaseSync || !window.firebaseSync.ready) return;
    // 若本次是 SEED 版本更新，先把新行程推上雲端，避免被舊資料蓋回去
    if(window.__seedJustUpgraded){
      window.__seedJustUpgraded=false;
      saveDaysSync();
    }
    window.firebaseSync.listen(data=>{
      if(data && data.days){
        daysSyncing=true;
        data.days.forEach(remoteDay=>{
          const localDay = STATE.days.find(d=>d.id===remoteDay.id);
          if(localDay){
            remoteDay.items.forEach(remoteIt=>{
              const localIt = localDay.items.find(it=>it.id===remoteIt.id);
              if(localIt && localIt.photoData) remoteIt.photoData = localIt.photoData;
            });
          }
        });
        STATE.days = data.days;
        if(!STATE.days.find(d=>d.id===currentDayId)) currentDayId = STATE.days[0].id;
        saveState();
        renderAll();
        daysSyncing=false;
      } else {
        saveDaysSync();
      }
    });
  }
  if(window.firebaseSync){ setupListener(); }
  else{ window.addEventListener('firebase-ready', setupListener, {once:true}); }
}
function calcBalances(){
  const n=STATE.people.length;
  const paid=new Array(n).fill(0), owed=new Array(n).fill(0);
  STATE.expenses.forEach(e=>{
    paid[e.payer] += e.amount;
    const among = e.splitAmong && e.splitAmong.length ? e.splitAmong : STATE.people.map((_,i)=>i);
    const share = e.amount/among.length;
    among.forEach(i=>owed[i]+=share);
  });
  return STATE.people.map((name,i)=>({name, paid:paid[i], owed:owed[i], net:paid[i]-owed[i]}));
}
function simplifyDebts(balances){
  const creditors = balances.filter(b=>b.net>0.5).map(b=>({name:b.name, amt:b.net})).sort((a,b)=>b.amt-a.amt);
  const debtors = balances.filter(b=>b.net<-0.5).map(b=>({name:b.name, amt:-b.net})).sort((a,b)=>b.amt-a.amt);
  const tx=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay=Math.min(debtors[i].amt, creditors[j].amt);
    tx.push({from:debtors[i].name, to:creditors[j].name, amt:pay});
    debtors[i].amt-=pay; creditors[j].amt-=pay;
    if(debtors[i].amt<0.5) i++;
    if(creditors[j].amt<0.5) j++;
  }
  return tx;
}
function renderSplit(){
  const peopleWrap=document.getElementById('splitPeople'); peopleWrap.innerHTML='';
  STATE.people.forEach((name,i)=>{
    const chip=document.createElement('div');
    chip.className='chip'; chip.textContent=name;
    chip.onclick=()=>{
      const nv=prompt('這位的名字？', name);
      if(nv){ STATE.people[i]=nv; saveState(); renderSplit(); }
    };
    peopleWrap.appendChild(chip);
  });

  const balances=calcBalances();
  const total=STATE.expenses.reduce((s,e)=>s+e.amount,0);
  const tx=simplifyDebts(balances);
  const sum=document.getElementById('splitSummary');
  sum.innerHTML = `
    <div class="splitTotal">總花費（¥）　<span class="mono">${total.toLocaleString()}</span></div>
    <div class="balanceGrid">${balances.map(b=>`
      <div class="balanceCard">
        <div class="balanceName">${b.name}</div>
        <div class="balanceVal ${b.net>0.5?'pos':b.net<-0.5?'neg':''}">${b.net>0.5?'+':''}${Math.round(b.net).toLocaleString()}</div>
      </div>`).join('')}</div>
    ${tx.length?`<div class="settleBox"><div class="settleTitle">💸 建議結算</div>${tx.map(t=>`<div class="settleLine">${t.from} → ${t.to}　<span class="mono">${Math.round(t.amt).toLocaleString()}</span></div>`).join('')}</div>`
      : `<div class="settleBox"><div class="settleTitle">✅ 目前打平，不用轉帳</div></div>`}
  `;

  const list=document.getElementById('expenseList'); list.innerHTML='';
  [...STATE.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(e=>{
    const among = e.splitAmong && e.splitAmong.length ? e.splitAmong : STATE.people.map((_,i)=>i);
    const div=document.createElement('div');
    div.className='expenseItem';
    div.innerHTML=`
      <div class="expenseMain">
        <div class="expenseDesc">${e.desc||'（無說明）'}</div>
        <div class="expenseMeta">${e.date||''}　${STATE.people[e.payer]||'?'} 付款　由 ${among.length} 人分攤</div>
      </div>
      <div class="expenseAmt mono">${e.amount.toLocaleString()}</div>
      <button class="iconbtn" data-del-exp="${e.id}">🗑️</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll('[data-del-exp]').forEach(b=>{
    b.onclick=()=>{
      if(!confirm('刪除這筆花費？')) return;
      STATE.expenses=STATE.expenses.filter(x=>x.id!==b.dataset.delExp);
      saveState(); renderSplit();
    };
  });
}
function openExpenseForm(){
  const old=document.getElementById('expenseFormEl'); if(old) old.remove();
  const f=document.createElement('form');
  f.className='itemForm'; f.id='expenseFormEl';
  f.innerHTML=`
    <div><label>金額（日圓）</label><input type="number" name="amount" required min="0" step="1"></div>
    <div><label>誰付的</label><select name="payer">${STATE.people.map((p,i)=>`<option value="${i}">${p}</option>`).join('')}</select></div>
    <div><label>說明</label><input type="text" name="desc" placeholder="例如：晚餐、油錢、過路費、停車"></div>
    <div><label>日期</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div>
      <label>由誰分攤（預設全部）</label>
      <div class="splitCheckRow">${STATE.people.map((p,i)=>`<label class="check"><input type="checkbox" name="among" value="${i}" checked> ${p}</label>`).join('')}</div>
    </div>
    <div class="formActions">
      <button type="button" class="btn" id="cancelExpenseForm">取消</button>
      <button type="submit" class="btn primary">新增</button>
    </div>`;
  document.getElementById('expenseList').before(f);
  f.querySelector('#cancelExpenseForm').onclick=()=>{ f.remove(); };
  f.onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(f);
    const among=fd.getAll('among').map(Number);
    STATE.expenses.push({
      id:'e'+Date.now(),
      amount: parseFloat(fd.get('amount'))||0,
      payer: parseInt(fd.get('payer')),
      desc: fd.get('desc')||'',
      date: fd.get('date')||'',
      splitAmong: among.length?among:STATE.people.map((_,i)=>i)
    });
    saveState(); f.remove(); renderSplit();
  };
}

function renderPackingPanel(){
  const box=document.getElementById('infoPackingPanel');
  const checked = loadPackingChecked();
  const total = PACKING_LIST.reduce((n,c)=>n+c.items.length,0);
  const doneCount = Object.values(checked).filter(Boolean).length;
  box.innerHTML = `<p style="font-size:12px;color:var(--ink-2);margin:0 0 10px">已勾選 ${doneCount} / ${total} 項</p>`
    + PACKING_LIST.map(c=>`
    <div class="appCard">
      <div class="appName" style="margin-bottom:6px">${c.cat}</div>
      ${c.items.map(it=>{
        const key=c.cat+'|'+it;
        const isChecked = !!checked[key];
        return `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;color:${isChecked?'var(--ink-3)':'var(--ink)'};text-decoration:${isChecked?'line-through':'none'}">
          <input type="checkbox" class="packingCheck" data-key="${key.replace(/"/g,'&quot;')}" ${isChecked?'checked':''} style="width:17px;height:17px;flex-shrink:0">
          ${it}
        </label>`;
      }).join('')}
    </div>`).join('')
    + `<p style="font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px">勾選狀態只存在這台裝置本機，換裝置或清除瀏覽器資料會重置</p>`;
  box.querySelectorAll('.packingCheck').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const st = loadPackingChecked();
      st[cb.dataset.key] = cb.checked;
      savePackingChecked(st);
      renderPackingPanel();
  renderSimPanel();
    });
  });
}

function renderKoyoPanel(){
  const box=document.getElementById('infoKoyoPanel');
  const stage={green:1,start:2,peak:3,fade:4,fall:5,none:0};
  const cols=['#7FA36B','#E0A93A','#D9542B','#B5795A','#8A6A58'];
  const labels=['青葉','色づき始め','見頃','色あせ始め','落葉'];
  const bar=(n)=>`<div style="display:flex;gap:4px;margin-top:8px">${[0,1,2,3,4].map(i=>`<div style="flex:1;height:10px;border-radius:5px;background:${n===0?'rgba(139,123,114,0.15)':(i<n?cols[i]:'rgba(139,123,114,0.15)')}"></div>`).join('')}</div>`;
  const legend=`<div style="display:flex;gap:4px;margin:0 0 4px">${labels.map((l,i)=>`<div style="flex:1;text-align:center;font-size:10.5px;color:var(--ink-2);white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cols[i]};margin-right:3px"></span>${l}</div>`).join('')}</div>`;
  box.innerHTML = `<div class="appCard" style="padding:10px 14px">${legend}<div style="font-size:11px;color:var(--ink-3);text-align:center;margin-top:4px">資料：tenki.jp／Weathernews（10/2–10/3）</div></div>`
    + KOYO_SPOTS.map(s=>{
      const n=stage[s.status]??0;
      const url=s.tenkiUrl||s.wnUrl;
      const now = n===0 ? '無資料' : labels[n-1];
      return `<div class="appCard" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <div class="appName" style="font-size:14.5px">${s.name}</div>
          <div style="flex-shrink:0;font-size:12px;color:var(--ink-3)">${s.date}</div>
        </div>
        ${bar(n)}
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">
          <span style="color:${n?cols[n-1]:'var(--ink-3)'};font-weight:700">目前：${now}</span>
          ${url?`<a href="${url}" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none;font-weight:600">最新 →</a>`:''}
        </div>
      </div>`;}).join('');
}

function renderSouvenirPanel(){
  const box=document.getElementById('infoSouvenirPanel');
  const cell=(t)=>`<div style="background:var(--card-2);border-radius:10px;padding:6px 8px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1.35">${t}</div>`;
  box.innerHTML = SOUVENIR_LIST.map(g=>`
    <div class="dateLabel" style="margin-top:14px">${g.sec}</div>
    ${g.items.map(r=>`
      <div class="appCard">
        <div class="appName" style="font-size:16px">${r.title}</div>
        ${r.where?`<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;margin-top:8px">${cell(r.where)}${cell(r.keep)}</div>`:''}

    ${TRIP_APPS.filter(a=>a.category===cat).map(a=>`
      <div class="appCard">
        <div class="appName">${a.name}</div>
        <div class="appDesc">${a.desc}</div>
        <div class="mapLinks">${a.web ? `<a href="${a.web}" target="_blank" rel="noopener">🌐 開啟網站</a>` : `<a href="${a.ios}" target="_blank" rel="noopener">🍎 iOS</a><a href="${a.android}" target="_blank" rel="noopener">🤖 Android</a>`}</div>

}

document.getElementById('btnReset').onclick=async ()=>{
  if(!confirm('這會清掉你目前輸入的所有行程，改回範例資料，確定嗎？')) return;
  STATE=JSON.parse(JSON.stringify(SEED));
  currentDayId=STATE.days[0].id;
  await saveState();
  renderAll();
};

(async function init(){
  const splashStart = Date.now();
  STATE = await loadState();
  if(!STATE.days.length) STATE=JSON.parse(JSON.stringify(SEED));
  const today = new Date();
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const matchDay = STATE.days.find(d=>d.date===todayStr);
  currentDayId = matchDay ? matchDay.id : STATE.days[0].id;
  ensureSplitState();
  document.getElementById('view-itinerary').hidden=false;
  renderAll();
  renderSplit();
  renderAppsPanel();
  renderMarketsPanel();
  renderSouvenirPanel();
  renderKoyoPanel();
  renderRecipesPanel();
  renderDrivingTipsPanel();
  renderStaysPanel();
  renderPackingPanel();
  renderSimPanel();
  initDaysSync();
  const minShow = 1200;
  const elapsed = Date.now() - splashStart;
  setTimeout(()=>{
    const splash=document.getElementById('splashScreen');
    splash.classList.add('fade-out');
    setTimeout(()=>splash.remove(), 650);
  }, Math.max(0, minShow-elapsed));
})();

function syncTabbarHeight(){
  const tb=document.getElementById('tabbar');
  if(!tb) return;
  document.documentElement.style.setProperty('--tabbar-h', tb.offsetHeight+'px');
}
window.addEventListener('load', syncTabbarHeight);
window.addEventListener('resize', syncTabbarHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncTabbarHeight,200));
syncTabbarHeight();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      // 每次開啟主動檢查是否有新版，有的話下次開啟就會生效
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
